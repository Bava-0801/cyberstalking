<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ status_code or 404 }} — {{ title or 'Page Not Found' }} | TraceX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-wrapper">
  <div class="auth-box" style="text-align: center; max-width: 480px;">
    <div style="margin-bottom: 1.5rem;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <div class="brand-badge" style="display: inline-block; margin-bottom: 1rem;">HTTP {{ status_code or 404 }}</div>
    <h1 class="auth-title">{{ title or 'Page Not Found' }}</h1>
    <p class="auth-subtitle" style="margin-bottom: 2rem;">
      {{ message or "The requested resource could not be found or may have been relocated." }}
    </p>

    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <a href="/dashboard" class="btn btn-primary">Return to Dashboard</a>
      <a href="/" class="btn btn-secondary">Return Home</a>
    </div>

    <div class="auth-footer" style="margin-top: 2rem;">
      TraceX Cyberstalking Detection &amp; Digital Safety Platform
    </div>
  </div>
</body>
</html>
