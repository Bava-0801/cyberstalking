<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — TraceX Security Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-header">
      <a href="/" class="brand-logo" id="reg-auth-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
        <span>TraceX</span>
      </a>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Register to analyze suspicious communications and save incident logs.</p>
    </div>

    <!-- Error Alert Box -->
    <div id="auth-error-box" class="alert alert-danger" style="display: none;"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="reg-username" class="form-label">Username</label>
        <input 
          type="text" 
          id="reg-username" 
          name="username" 
          class="form-input" 
          autocomplete="username" 
          required 
          minlength="3" 
          maxlength="50"
          placeholder="Minimum 3 characters"
        >
        <div class="form-help">Letters, numbers, underscores, and dashes only.</div>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">Password</label>
        <input 
          type="password" 
          id="reg-password" 
          name="password" 
          class="form-input" 
          autocomplete="new-password" 
          required 
          minlength="8"
          placeholder="Minimum 8 characters"
        >
      </div>

      <div class="form-group">
        <label for="reg-confirm-password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="reg-confirm-password" 
          name="confirm_password" 
          class="form-input" 
          autocomplete="new-password" 
          required 
          minlength="8"
          placeholder="Repeat your password"
        >
      </div>

      <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
