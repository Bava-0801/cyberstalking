<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TraceX Security Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-header">
      <a href="/" class="brand-logo" id="auth-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
        <span>TraceX</span>
      </a>
      <h1 class="auth-title">Sign In to Dashboard</h1>
      <p class="auth-subtitle">Access your digital safety workspace and incident records.</p>
    </div>

    <!-- Error Alert Box -->
    <div id="auth-error-box" class="alert alert-danger" style="display: none;"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          autocomplete="username" 
          required 
          placeholder="Enter your username"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          autocomplete="current-password" 
          required 
          placeholder="Enter your password"
        >
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register-page">Create an account</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
